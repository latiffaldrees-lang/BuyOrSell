<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Signals</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white;
            min-height: 100vh;
            overflow: hidden;
            padding: 15px;
        }
        
        /* صفحة كلمة المرور */
        .password-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .password-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 380px;
            width: 90%;
        }
        
        .password-logo {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        
        .password-input {
            width: 100%;
            padding: 14px;
            margin: 18px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1em;
            text-align: center;
        }
        
        .password-btn {
            width: 100%;
            background: linear-gradient(45deg, #00d4ff, #0099ff);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
        }
        
        .error-message {
            color: #ff6b9d;
            margin-top: 10px;
            font-size: 0.9em;
            display: none;
        }

        /* الموقع الرئيسي */
        .main-site {
            display: none;
            height: 100vh;
        }
        
        .dashboard {
            max-width: 1000px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        
        /* الهيدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 15px;
        }
        
        .logo {
            font-size: 1.6em;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .tagline {
            color: #a0a0c0;
            font-size: 0.8em;
        }
        
        /* المحتوى الرئيسي */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;


                    <div class="loading-message" id="loadingMessage">
                        <div class="loading-spinner">⏳</div>
                        <div class="welcome-text">
                            <h3>Analyzing Market Patterns...</h3>
                            <p>Calculating optimal entry point with 100% accuracy</p>
                        </div>
                    </div>

                    <div class="signal-result" id="signalResult">
                        <h3 style="color: #00d4ff; margin-bottom: 10px; font-size: 1em;">TRADING SIGNAL</h3>
                        <div class="signal-type" id="signalType">BUY</div>
                        
                        <div class="signal-grid">
                            <div class="signal-item">
                                <div class="signal-label">MARKET</div>
                                <div class="signal-value" id="signalMarket">EUR/USD</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">TIMEFRAME</div>
                                <div class="signal-value" id="signalTimeframe">1M</div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">CONFIDENCE</div>
                                <div class="signal-value">
                                    <span id="signalConfidence" class="confidence">85%</span>
                                </div>
                            </div>
                            <div class="signal-item">
                                <div class="signal-label">STRATEGY</div>
                                <div class="signal-value" id="signalStrategy">Support/Resistance</div>
                            </div>
                        </div>
                        
                        <div class="signal-time">
                            <div class="signal-label">OPTIMAL ENTRY TIME</div>
                            <div class="signal-value" id="signalTime">02:06 PM</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_PASSWORD = "PassBigMoney";
        let isGenerating = false;
        let countdownTimer;
        let lastGenerateTime = 0; // وقت آخر ضغط على الزر
        
        function checkPassword() {
            const passwordInput = document.getElementById('passwordInput');
            const errorMessage = document.getElementById('errorMessage');
            const passwordScreen = document.getElementById('passwordScreen');
            const mainSite = document.getElementById('mainSite');
            
            if (passwordInput.value === CORRECT_PASSWORD) {
                passwordScreen.style.display = 'none';
                mainSite.style.display = 'block';
            } else {
                errorMessage.style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }
        
        function checkEnter(event) {
            if (event.key === 'Enter') {
                checkPassword();
            }
        }
        
        function generateSignal() {
            if (isGenerating) return;
            
            const strategy = document.getElementById('strategy').value;
            const system = document.getElementById('system').value;
            const market = document.getElementById('market').value;
            
            if (!strategy || !system || !market) {
                alert('⚠️ Please select Strategy, System, and Market!');
                return;
            }
            
            // تعطيل الزر
            isGenerating = true;
            const generateBtn = document.getElementById('generateBtn');
            const timerDisplay = document.getElementById('timerDisplay');
            
            generateBtn.disabled = true;
            generateBtn.textContent = '⏳ GENERATING SIGNAL...';
            
            // إظهار رسالة التحميل
            document.getElementById('welcomeMessage').style.display = 'none';
            document.getElementById('loadingMessage').style.display = 'flex';
            document.getElementById('signalResult').style.display = 'none';
            
            const currentTime = Date.now();
            const timeSinceLastGenerate = currentTime - lastGenerateTime;
            
            // إذا كان أول مرة أو مر أكثر من 60 ثانية منذ آخر ضغط
            if (lastGenerateTime === 0 || timeSinceLastGenerate > 60000) {
                // نتيجة فورية
                setTimeout(() => {
                    showOptimalSignal(strategy, system, market);
                    generateBtn.disabled = false;
                    generateBtn.textContent = '🎯 GENERATE SIGNAL';
                    isGenerating = false;
                    lastGenerateTime = currentTime;
                }, 1500);
            } else {
                // إذا ضغط مرتين ورا بعض (خلال 60 ثانية) - ينتظر 60 ثانية
                timerDisplay.style.display = 'block';
                
                // بدء العد التنازلي (60 ثانية)
                let timeLeft = 60;
                const timerElement = document.getElementById('timer');
                
                countdownTimer = setInterval(() => {
                    timeLeft--;
                    timerElement.textContent = timeLeft;
                    
                    if (timeLeft <= 0) {
                        clearInterval(countdownTimer);
                        showOptimalSignal(strategy, system, market);
                        generateBtn.disabled = false;
                        generateBtn.textContent = '🎯 GENERATE SIGNAL';
                        timerDisplay.style.display = 'none';
                        isGenerating = false;
                        lastGenerateTime = Date.now();
                    }
                }, 1000);
            }
        }
        
        function showOptimalSignal(strategy, system, market) {
            const strategies = {
                'support': 'Support/Resistance',
                'trend': 'Trend Following', 
                'breakout': 'Breakout',
                'scalping': 'Scalping'
            };
            
            // توليد إشارة عشوائية (60% BUY, 40% SELL)
            const randomSignal = Math.random();
            const signalType = randomSignal < 0.6 ? 'BUY' : 'SELL';
            
            // TIMEFRAME ثابت دائماً 1minute
            const timeframe = '1M';
            
            // توليد نسبة ثقة عشوائية بين 75% و 95%
            const confidence = Math.floor(Math.random() * 21) + 75; // 75-95%
            const confidenceElement = document.getElementById('signalConfidence');
            
            // تحديث النتائج
            document.getElementById('signalMarket').textContent = market;
            document.getElementById('signalType').textContent = signalType;
            document.getElementById('signalType').className = `signal-type ${signalType.toLowerCase()}`;
            document.getElementById('signalTimeframe').textContent = timeframe;
            confidenceElement.textContent = confidence + '%';
            
            // إضافة لون حسب مستوى الثقة
            if (confidence >= 90) {
                confidenceElement.className = 'confidence high';
            } else if (confidence >= 80) {
                confidenceElement.className = 'confidence medium';
            } else {
                confidenceElement.className = 'confidence low';
            }
            
            document.getElementById('signalStrategy').textContent = strategies[strategy];
            
            // حساب أفضل وقت دخول (بعد 2-5 دقائق من الوقت الحالي)
            const now = new Date();
            const randomMinutes = Math.floor(Math.random() * 3) + 2; // 2-4 دقائق
            const optimalEntry = new Date(now.getTime() + (randomMinutes * 60 * 1000));
            
            document.getElementById('signalTime').textContent = optimalEntry.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true 
            });
            
            // إخفاء رسالة التحميل وإظهار النتيجة
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('signalResult').style.display = 'flex';
        }
        
        document.getElementById('passwordInput').focus();
    </script>
</body>
</html>
